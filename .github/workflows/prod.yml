name: Deploy to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.9"
          enable-cache: true
          cache-dependency-glob: "backend/api/uv.lock"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect static files
        working-directory: backend/api
        run: uv run --isolated --locked --no-dev python manage.py collectstatic --noinput

      - name: Deploy backend with SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./backend"
          target: "/home/${{ secrets.SSH_USER }}/taconnect-prod/"

      - name: Install frontend dependencies
        run: npm install --prefix ./frontend

      - name: Build React app
        env:
          VITE_API_URL: "https://api.taconnect.lbl.gov/api"
          VITE_BACKEND_URL: "https://api.taconnect.lbl.gov"
        run: npm run build --prefix ./frontend

      - name: Deploy frontend with SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./frontend/dist"
          target: "/home/${{ secrets.SSH_USER }}/taconnect-prod/"

      - name: Run migrations and restart application server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            source /home/${{ secrets.SSH_USER }}/taconnect-prod/ta-prod-env/bin/activate
            python /home/${{ secrets.SSH_USER }}/taconnect-prod/backend/api/manage.py migrate
            sudo systemctl restart gunicorn-prod
            sudo systemctl restart nginx
