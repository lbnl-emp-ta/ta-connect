name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.9"
          enable-cache: true
          cache-dependency-glob: "backend/api/uv.lock"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect static files
        working-directory: backend/api
        run: uv run --isolated --locked --no-dev python manage.py collectstatic --noinput

      - name: Deploy backend with SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./backend"
          target: "/home/${{ secrets.SSH_USER }}/taconnect-staging/"

      - name: Install frontend dependencies
        run: npm install --prefix ./frontend

      - name: Build React app
        env:
          VITE_API_URL: "https://api.staging.taconnect.lbl.gov/api"
          VITE_BACKEND_URL: "https://api.staging.taconnect.lbl.gov"
        run: npm run build --prefix ./frontend

      - name: Deploy frontend with SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./frontend/dist"
          target: "/home/${{ secrets.SSH_USER }}/taconnect-staging/"

      - name: Sync backend, run migrations, and restart application server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            cd /home/${{ secrets.SSH_USER }}/taconnect-staging/backend/api
            uv sync --locked --no-dev
            uv run --no-sync python manage.py migrate
            sudo systemctl restart gunicorn-staging
            sudo systemctl restart nginx
